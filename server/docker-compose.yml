services:
  postgres:
    image: postgres:18.1
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: olongapunta_db
    ports:
      - "5436:5432"
    volumes:
      - postgres:/var/lib/postgresql

  redis:
    image: redis:latest
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres:
  redis_data:
